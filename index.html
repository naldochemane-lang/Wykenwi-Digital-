/* ═══════════════════════════════════════════════════════════════════
   SOM MODULE — sons via AudioContext (sem ficheiros de áudio)
═══════════════════════════════════════════════════════════════════ */
const Som = (() => {
  let _ctx = null;
  const ctx = () => {
    if (!_ctx) try { _ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) {}
    return _ctx;
  };
  const beep = (freq, type, dur, vol, delay=0) => {
    const c = ctx(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = type; o.frequency.setValueAtTime(freq, c.currentTime + delay);
    g.gain.setValueAtTime(vol, c.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + dur);
    o.start(c.currentTime + delay); o.stop(c.currentTime + delay + dur);
  };
  return {
    acerto:   () => { beep(523,'sine',.12,.18); beep(784,'sine',.18,.15,.1); },
    erro:     () => { beep(220,'triangle',.22,.16); beep(180,'triangle',.18,.12,.12); },
    combo:    () => { [523,659,784,1047].forEach((f,i)=>beep(f,'sine',.18,.16,i*.07)); },
    resultado:(s) => {
      if(s>=3) [[523,0],[659,.09],[784,.18],[1047,.27],[1319,.36]].forEach(([f,d])=>beep(f,'sine',.28,.16,d));
      else if(s>=2) [[523,0],[659,.1],[784,.2]].forEach(([f,d])=>beep(f,'sine',.22,.15,d));
      else beep(330,'triangle',.4,.12);
    },
    xp: () => { beep(880,'sine',.1,.12); beep(1100,'sine',.12,.1,.08); },
    virar: () => beep(440,'sine',.06,.1),
    par:   () => { beep(660,'sine',.1,.14); beep(880,'sine',.14,.12,.08); },
  };
})();

/* ═══════════════════════════════════════════════════════════════════
   MASCOTE MODULE — bolha de voz contextual
═══════════════════════════════════════════════════════════════════ */
const Mascote = (() => {
  let _timer = null;
  const falar = (msg, durMs=3200) => {
    const bubble = document.getElementById('mascote-bubble');
    const txt    = document.getElementById('mascote-txt');
    if (!bubble || !txt) return;
    clearTimeout(_timer);
    txt.textContent = msg;
    bubble.classList.add('visivel');
    _timer = setTimeout(() => bubble.classList.remove('visivel'), durMs);
  };
  const msgs = {
    acerto:   ['🌟 Muito bem!','✨ Correcto!','🎉 Óptimo!','👏 Excelente!','🔥 Fantástico!'],
    erro:     ['💪 Quase! Tenta outra vez!','🤔 Não desistas!','😊 Pratica mais!'],
    combo3:   ['🔥 COMBO ×3! Incrível!','⚡ Em chama! ×3!'],
    combo6:   ['🌟 LENDÁRIO! Imparável!','🏆 Que jogador! Lendário!'],
    resultado:['🎯 Jogo terminado! Bom trabalho!','🦉 Eu sabia que conseguias!'],
    entrada:  ['👋 Olá! Pronto para aprender?','🦉 Vamos lá! Escolhe uma actividade!'],
    nivel:    ['🚀 Novo nível desbloqueado!','⭐ Subiste de nível! Parabéns!'],
  };
  const rand = arr => arr[Math.floor(Math.random()*arr.length)];
  return {
    acerto:    () => falar(rand(msgs.acerto), 2200),
    erro:      () => falar(rand(msgs.erro), 2800),
    combo:     (n) => falar(rand(n>=6?msgs.combo6:msgs.combo3), 2000),
    resultado: () => falar(rand(msgs.resultado), 3500),
    entrada:   () => falar(rand(msgs.entrada), 3000),
    nivel:     () => falar(rand(msgs.nivel), 3000),
    custom:    (m, d) => falar(m, d),
  };
})();

/* ═══════════════════════════════════════════════════════════════════
   DADOS MODULE — persistência em localStorage
═══════════════════════════════════════════════════════════════════ */
const Dados = (() => {
  const KEY = 'aprender_plus_v1';
  const def = () => ({ xp: 0, streak: 0, lastDay: null, mundos: {}, perfil: '', avatar: '🦉', faixa: 'young' });

  const load = () => {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? { ...def(), ...JSON.parse(raw) } : def();
    } catch { return def(); }
  };

  const save = (data) => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
  };

  const calcStreak = (data) => {
    const now = Date.now();
    const last = data.lastDay || 0;
    const diffDias = Math.floor((now - last) / (1000*60*60*24));
    if (!data.lastDay)       return { streak: 1, lastDay: now };
    if (diffDias === 0)      return { streak: data.streak, lastDay: data.lastDay };
    if (diffDias === 1)      return { streak: data.streak + 1, lastDay: now };
    return                          { streak: 1, lastDay: now };
  };

  return { load, save, calcStreak };
})();

/* ═══════════════════════════════════════════════════════════════════
   PWA MODULE — instalar como app
═══════════════════════════════════════════════════════════════════ */
(() => {
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    const alreadyDismissed = localStorage.getItem('aprender_pwa_dismissed');
    if (!alreadyDismissed) {
      setTimeout(() => document.getElementById('pwa-banner')?.classList.add('show'), 4000);
    }
  });
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('pwa-install-btn')?.addEventListener('click', async () => {
      document.getElementById('pwa-banner')?.classList.remove('show');
      if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
    });
    document.getElementById('pwa-close-btn')?.addEventListener('click', () => {
      document.getElementById('pwa-banner')?.classList.remove('show');
      localStorage.setItem('aprender_pwa_dismissed', '1');
    });
  });
})();

function ProgressBar({valor,max,cor,h=10}){
  const pct=Math.min(100,(valor/Math.max(max,1))*100);
  return(
    <div style={{background:'rgba(0,0,0,.12)',borderRadius:99,height:h,overflow:'hidden'}}>
      <div style={{height:'100%',borderRadius:99,
        background:`linear-gradient(90deg,${cor},${cor}bb)`,
        width:`${pct}%`,transition:'width .55s cubic-bezier(.34,1.56,.64,1)',
        boxShadow:`0 0 8px ${cor}66`}}/>
    </div>
  );
}

function Particulas({ativo}){

/* Botão de escolha adaptável */
function BotaoOp({texto,onClick,disabled,correto,errado,neutro,cor,sombra,fontSize='1rem',padding='14px 10px'}){
  const [p,setP]=useState(false);
  const bg=correto?'#10B981':errado?'#EF4444':'#fff';
  const bd=correto?'#065F46':errado?'#991B1B':neutro?cor:'#E2E8F0';
  const sh=correto?'#047857':errado?'#7F1D1D':neutro?sombra:'#D1D5DB';
  return(
    <button disabled={disabled}
      onPointerDown={()=>setP(true)}
      onPointerUp={()=>{setP(false);if(!disabled){Som.acerto&&Som.acerto();onClick?.();}}}
      onPointerLeave={()=>setP(false)}
      style={{background:bg,border:`2.5px solid ${bd}`,borderRadius:16,padding,
        fontFamily:"'Baloo 2',cursive",fontWeight:900,fontSize,
        color:correto||errado?'#fff':'#1C1917',cursor:disabled?'not-allowed':'pointer',
        boxShadow:p?`0 2px 0 ${sh}`:`0 5px 0 ${sh}`,
        transform:p?'translateY(3px)':'none',
        transition:'transform .1s,box-shadow .1s,background .25s,border-color .25s',
        width:'100%',textAlign:'center',
        animation:correto?'correctPop .35s ease':errado?'shake .35s ease':'none'}}>
      {texto}
    </button>
  );
}

function Estrelas({pontos,total}){
  const pct=pontos/total;
  const n=pct>=.9?3:pct>=.6?2:pct>=.3?1:0;
  return(
    <div style={{display:'flex',gap:8,justifyContent:'center',fontSize:'2.8rem'}}>
      {[0,1,2].map(i=>(
        <span key={i} style={{
          filter:i<n?'drop-shadow(0 3px 8px rgba(245,158,11,.6))':'grayscale(1) opacity(.22)',
          animation:i<n?`starPop .5s cubic-bezier(.34,1.56,.64,1) ${i*.18}s both`:'none'}}>⭐</span>
      ))}
    </div>
  );
}

/* ══════════════════════════════════════
   ECRÃ RESULTADO (universal)
══════════════════════════════════════ */
function Resultado({pontos,total,xpGanho,cor,sombra,faixa,onRepetir,onMenu}){
  const pct=Math.round((pontos/Math.max(total,1))*100);
  const stars=pct>=90?3:pct>=60?2:pct>=30?1:0;
  const emoji=['🤔','💪','🌟','🏆'][stars];
  const msg=['Não desistas!','Bom esforço!','Muito bem!','Perfeito!'][stars];
  useEffect(()=>{
    Som.resultado(stars);
    setTimeout(()=>{
      Mascote.resultado();
      if(stars>=2) falar(msg,.9);
    },400);
  },[]);
  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',
      justifyContent:'center',padding:'24px 20px',
      background:'linear-gradient(160deg,#FFFBEB,#FEF9C3,#FEF08A)',gap:12}}>
      <div style={{fontSize:'5rem',animation:'popIn .55s cubic-bezier(.34,1.56,.64,1)',
        filter:'drop-shadow(0 8px 18px rgba(0,0,0,.18))'}}>{emoji}</div>
      <div style={{fontFamily:"'Baloo 2',cursive",fontWeight:900,
        fontSize: faixa==='young'?'2rem':'1.75rem',
        color:'#FF6B2B',textAlign:'center'}}>{msg}</div>
      <Estrelas pontos={pontos} total={total}/>
      <div style={{background:'linear-gradient(135deg,#FBBF24,#F59E0B)',borderRadius:16,
        padding:'10px 24px',fontFamily:"'Baloo 2',cursive",fontWeight:900,
        fontSize: faixa==='young'?'1.3rem':'1.1rem',color:'#fff',
        boxShadow:'0 5px 0 #B45309',animation:'xpBurst .6s .3s cubic-bezier(.34,1.56,.64,1) both'}}>
        +{xpGanho} XP! ⭐
      </div>
      <div style={{fontFamily:'Nunito,sans-serif',fontWeight:800,color:'#92807A',
        fontSize:faixa==='young'?'1rem':'.9rem'}}>
        {pontos}/{total} correctas · {pct}%
      </div>
      <div style={{display:'flex',gap:6,marginBottom:4}}>
        {Array.from({length:total}).map((_,i)=>(
          <div key={i} style={{width:faixa==='young'?24:20,height:faixa==='young'?24:20,
            borderRadius:'50%',background:i<pontos?'#10B981':'#FCA5A5',
            boxShadow:i<pontos?'0 3px 0 #047857':'0 3px 0 #991B1B'}}/>
        ))}
      </div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap',justifyContent:'center'}}>
        <button onClick={onRepetir} style={{background:'#fff',border:`2.5px solid ${cor}`,
          borderRadius:14,padding: faixa==='young'?'12px 22px':'10px 18px',
          fontFamily:"'Baloo 2',cursive",fontWeight:900,
          color:cor,fontSize:faixa==='young'?'1.05rem':'.95rem',cursor:'pointer',
          boxShadow:`0 4px 0 ${sombra}33`}}>🔁 Repetir</button>
        <button onClick={onMenu} style={{background:'#fff',border:'2.5px solid #E2E8F0',
          borderRadius:14,padding: faixa==='young'?'12px 20px':'10px 16px',
          fontFamily:"'Baloo 2',cursive",fontWeight:900,
          color:'#64748B',fontSize:faixa==='young'?'1.05rem':'.9rem',cursor:'pointer',
          boxShadow:'0 4px 0 #E2E8F0'}}>← Menu</button>
      </div>
    </div>
  );
}

/* JOGO Y1 — ABC */
function JogoABC_Young({onFim,onXp,faixa}){
  const [pool]=useState(()=>shuffle([...D_YOUNG.abc]).slice(0,5));
  const [idx,setIdx]=useState(0);
  const [fb,setFb]=useState(null);
  const [pts,setPts]=useState(0);
  const [combo,setCombo]=useState(0);
  const [done,setDone]=useState(false);
  const [opts,setOpts]=useState([]);
  const F=FAIXAS[faixa];

  useEffect(()=>{
    const it=pool[idx]; if(!it)return;
    const outros=D_YOUNG.abc.filter(x=>x.letra!==it.letra).map(x=>x.letra);
    setOpts(shuffle([it.letra,...shuffle(outros).slice(0,2)])); // 3 opções para young
    setFb(null);
    setTimeout(()=>falar(it.palavra,.7),250);
  },[idx]);

  if(done)return<Resultado pontos={pts} total={pool.length} xpGanho={pts*10+combo*4}
    cor={F.cor} sombra={F.sombra} faixa={faixa}
    onRepetir={()=>{setIdx(0);setPts(0);setCombo(0);setDone(false);}} onMenu={onFim}/>;

  const it=pool[idx];
  const resp=(op)=>{
    if(fb)return;
    const ok=op===it.letra;
    setFb({tipo:ok?'certo':'errado',msg:ok?`🌟 ${it.letra} de ${it.palavra}!`:`❌ Era a letra ${it.letra}!`});
    if(ok){setPts(p=>p+1);setCombo(c=>c+1);onXp(10);}else setCombo(0);
    setTimeout(()=>{idx+1>=pool.length?setDone(true):setIdx(prev=>prev+1);},1700);
  };

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',background:'#FFF3E8',overflow:'hidden'}}>
      <GameHeader titulo="Aprende o ABC" emoji="🔤"
        cor={F.cor} sombra={F.sombra} idx={idx} total={pool.length}
        combo={combo} faixa={faixa} onMenu={onFim}/>
      <div style={{flex:1,overflowY:'auto',padding:'16px 14px 24px',display:'flex',flexDirection:'column',gap:14}}>
        {/* emoji grande + letra */}
        <div style={{textAlign:'center',padding:'8px 0'}}>
          <div style={{fontSize:'6.5rem',lineHeight:1,marginBottom:8,
            animation:'mascotBreathe 3s ease-in-out infinite',
            filter:'drop-shadow(0 6px 14px rgba(0,0,0,.15))'}}>
            {it.emoji}
          </div>
          <button onClick={()=>falar(it.palavra,.7)} style={{
            background:F.light,border:'none',borderRadius:14,
            padding:'8px 20px',fontFamily:'Nunito,sans-serif',fontWeight:800,
            fontSize:'1rem',color:F.sombra,cursor:'pointer',
            boxShadow:`0 4px 0 ${F.cor}33`}}>
            🔊 {it.palavra}
          </button>
        </div>
        <p style={{fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:'1rem',
          color:'#6B7280',textAlign:'center'}}>
          Qual é a letra desta palavra? 👇
        </p>
        {/* 3 botões grandes para young */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
          {opts.map(op=>(
            <BotaoOp key={op} texto={op}
              correto={fb&&op===it.letra} errado={fb?.tipo==='errado'&&op!==it.letra&&false}
              neutro={!fb} cor={F.cor} sombra={F.sombra}
              fontSize='2rem' padding='18px 8px'
              disabled={!!fb} onClick={()=>resp(op)}/>
          ))}
        </div>
        <FbBox fb={fb}/>
      </div>
    </div>
  );
}

/* JOGO Y6 — Memória Young (6 pares, grade 4×3) */
function JogoMemoria_Young({onFim,onXp,faixa}){
  const pares=shuffle([...D_YOUNG.memoria,...D_YOUNG.memoria]).map((c,i)=>({...c,uid:i,virado:false,encontrado:false}));
  const [cartas,setCartas]=useState(pares);
  const [sel,setSel]=useState([]);
  const [bloq,setBloq]=useState(false);
  const [found,setFound]=useState(0);
  const [tent,setTent]=useState(0);
  const [done,setDone]=useState(false);
  const F=FAIXAS[faixa];
  const total=D_YOUNG.memoria.length;

  const virar=(uid)=>{
    if(bloq||cartas.find(c=>c.uid===uid).virado||cartas.find(c=>c.uid===uid).encontrado)return;
    Som.virar();
    const nsel=[...sel,uid];
    setCartas(cs=>cs.map(c=>c.uid===uid?{...c,virado:true}:c));
    setSel(nsel);
    if(nsel.length===2){
      setBloq(true);setTent(t=>t+1);
      const [a,b]=nsel.map(uid=>cartas.find(c=>c.uid===uid));
      if(a.id===b.id){
        setTimeout(()=>{
          Som.par();
          setCartas(cs=>cs.map(c=>nsel.includes(c.uid)?{...c,encontrado:true}:c));
          setSel([]);setBloq(false);
          const nf=found+1;setFound(nf);onXp(8);
          if(nf===total)setDone(true);
        },500);
      }else{
        setTimeout(()=>{
          Som.erro();
          setCartas(cs=>cs.map(c=>nsel.includes(c.uid)?{...c,virado:false}:c));
          setSel([]);setBloq(false);
        },900);
      }
    }
  };

  const stars=tent<=total+2?3:tent<=total+5?2:1;
  if(done)return<Resultado pontos={stars} total={3} xpGanho={found*8}
    cor={F.cor} sombra={F.sombra} faixa={faixa}
    onRepetir={()=>{setCartas(shuffle([...D_YOUNG.memoria,...D_YOUNG.memoria]).map((c,i)=>({...c,uid:i,virado:false,encontrado:false})));setSel([]);setBloq(false);setFound(0);setTent(0);setDone(false);}}
    onMenu={onFim}/>;

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',background:F.light,overflow:'hidden'}}>
      <GameHeader titulo="Memória" emoji="🧠"
        cor={F.cor} sombra={F.sombra} idx={found} total={total}
        combo={0} faixa={faixa} onMenu={onFim}/>
      <div style={{flex:1,overflowY:'auto',padding:'14px 12px'}}>
        <p style={{fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:'1rem',
          color:F.sombra,textAlign:'center',marginBottom:12}}>
          Encontra os pares! 🧩 Tentativas: {tent}
        </p>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
          {cartas.map(c=>(
            <button key={c.uid} onClick={()=>virar(c.uid)}
              style={{aspectRatio:'1',borderRadius:16,border:'none',cursor:'pointer',
                background:c.encontrado?'#ECFDF5':c.virado?'#fff':`linear-gradient(135deg,${F.cor},${F.sombra})`,
                boxShadow:c.encontrado?'0 3px 0 #A7F3D0':c.virado?'0 4px 0 #E2E8F0':`0 5px 0 ${F.sombra}`,
                fontSize:c.virado||c.encontrado?'2.2rem':'1.8rem',
                transition:'all .3s cubic-bezier(.34,1.56,.64,1)',
                transform:c.virado||c.encontrado?'scale(1.07)':'scale(1)'}}>
              {c.virado||c.encontrado?c.emoji:'❓'}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

  useEffect(()=>{
    const it=pool[idx];if(!it)return;
    setLetras(shuffle(it.t.split('')));

    setTimeout(()=>falar(it.t,.75),300);
  },[idx]);

      setFb({tipo:ok?'certo':'errado',msg:ok?`🌟 Perfeito! "${it.t}"!`:`❌ Era "${it.t}"`});
      if(ok){setPts(p=>p+1);setCombo(c=>c+1);onXp(15);}else setCombo(0);
      setTimeout(()=>{idx+1>=pool.length?setDone(true):setIdx(prev=>prev+1);},1800);
    }
  };
  const apagar=()=>{if(!resp.length||fb)return;setResp(r=>r.slice(0,-1));setDis(d=>d.slice(0,-1));};

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',background:'#F0F9FF',overflow:'hidden'}}>

            background:'#E0F2FE',border:'none',borderRadius:12,padding:'6px 16px',

        <div style={{minHeight:54,background:'#F0F9FF',borderRadius:14,
          border:'2.5px solid #BAE6FD',padding:'10px',
          display:'flex',alignItems:'center',justifyContent:'center',

          {resp.length===0
            ?<span style={{color:'#94A3B8',fontFamily:'Nunito,sans-serif',fontWeight:700,fontSize:'.85rem'}}>
              Toca nas letras abaixo…</span>
            :resp.map((l,i)=>(
              <span key={i} style={{width:38,height:42,display:'inline-flex',alignItems:'center',
                justifyContent:'center',borderRadius:10,
                background:fb?(fb.tipo==='certo'?'#10B981':'#EF4444'):'#0EA5E9',
                color:'#fff',fontFamily:"'Baloo 2',cursive",fontWeight:900,fontSize:'1.2rem',
                boxShadow:fb?'none':'0 3px 0 #0174A8',transition:'background .3s'}}>
                {l.toUpperCase()}</span>
            ))}
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:7,justifyContent:'center'}}>
          {letras.map((l,i)=>(
            <button key={i} disabled={dis.includes(i)||!!fb} onClick={()=>tap(l,i)}
              style={{width:44,height:44,borderRadius:12,
                background:dis.includes(i)?'#F1F5F9':'#fff',
                border:`2.5px solid ${dis.includes(i)?'#E2E8F0':'#0EA5E9'}`,
                fontFamily:"'Baloo 2',cursive",fontWeight:900,fontSize:'1.15rem',
                color:dis.includes(i)?'#CBD5E1':'#0EA5E9',cursor:dis.includes(i)?'not-allowed':'pointer',
                boxShadow:dis.includes(i)?'none':'0 4px 0 #BAE6FD'}}>
              {l.toUpperCase()}
            </button>
          ))}
        </div>
        {resp.length>0&&!fb&&(
          <button onClick={apagar} style={{alignSelf:'center',background:'none',
            border:'2px solid #FECACA',borderRadius:10,padding:'6px 16px',
            color:'#EF4444',fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:'.8rem',cursor:'pointer'}}>
            ⌫ Apagar</button>
        )}

      </div>
    </div>
  );
}

/* JOGO O5 — Qual é o Diferente */
function JogoDiferente_Older({onFim,onXp,faixa}){

  const [pts,setPts]=useState(0);
  const [combo,setCombo]=useState(0);
  const [done,setDone]=useState(false);
  const [shuf,setShuf]=useState([]);
  const F=FAIXAS[faixa];

  useEffect(()=>{setShuf(shuffle(pool[idx]?.grupo||[]));setFb(null);},[idx]);
  if(done)return<Resultado pontos={pts} total={pool.length} xpGanho={pts*12+combo*5}
    cor={F.cor} sombra={F.sombra} faixa={faixa}
    onRepetir={()=>{setIdx(0);setPts(0);setCombo(0);setDone(false);}} onMenu={onFim}/>;

  return(

      <div style={{flex:1,overflowY:'auto',padding:'14px 12px 24px',display:'flex',flexDirection:'column',gap:12}}>

                borderRadius:20,padding:'20px 10px',cursor:fb?'default':'pointer',

              }}>

                  fontWeight:900,color:'#10B981',marginTop:4}}>✓ Intruso!</div>

          ))}
        </div>
        <FbBox fb={fb}/>
      </div>
    </div>
  );
}

/* JOGO O6 — Memória Older (8 pares) */
function JogoMemoria_Older({onFim,onXp,faixa}){
  const pares=shuffle([...D_OLDER.memoria,...D_OLDER.memoria]).map((c,i)=>({...c,uid:i,virado:false,encontrado:false}));
  const [cartas,setCartas]=useState(pares);
  const [sel,setSel]=useState([]);
  const [bloq,setBloq]=useState(false);
  const [found,setFound]=useState(0);
  const [tent,setTent]=useState(0);
  const [done,setDone]=useState(false);
  const F=FAIXAS[faixa];
  const total=D_OLDER.memoria.length;

  const virar=(uid)=>{
    if(bloq||cartas.find(c=>c.uid===uid).virado||cartas.find(c=>c.uid===uid).encontrado)return;
    Som.virar();
    const nsel=[...sel,uid];
    setCartas(cs=>cs.map(c=>c.uid===uid?{...c,virado:true}:c));
    setSel(nsel);
    if(nsel.length===2){
      setBloq(true);setTent(t=>t+1);
      const [a,b]=nsel.map(uid=>cartas.find(c=>c.uid===uid));
      if(a.id===b.id){
        setTimeout(()=>{
          Som.par();
          setCartas(cs=>cs.map(c=>nsel.includes(c.uid)?{...c,encontrado:true}:c));
          setSel([]);setBloq(false);const nf=found+1;setFound(nf);onXp(10);
          if(nf===total)setDone(true);
        },500);
      }else{
        setTimeout(()=>{
          Som.erro();
          setCartas(cs=>cs.map(c=>nsel.includes(c.uid)?{...c,virado:false}:c));
          setSel([]);setBloq(false);
        },900);
      }
    }
  };
  const stars=tent<=total+3?3:tent<=total+6?2:1;
  if(done)return<Resultado pontos={stars} total={3} xpGanho={found*10}
    cor={F.cor} sombra={F.sombra} faixa={faixa}
    onRepetir={()=>{setCartas(shuffle([...D_OLDER.memoria,...D_OLDER.memoria]).map((c,i)=>({...c,uid:i,virado:false,encontrado:false})));setSel([]);setBloq(false);setFound(0);setTent(0);setDone(false);}}
    onMenu={onFim}/>;

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',background:F.light,overflow:'hidden'}}>
      <GameHeader titulo="Memória" emoji="🧠"
        cor={F.cor} sombra={F.sombra} idx={found} total={total}
        combo={0} faixa={faixa} onMenu={onFim}/>
      <div style={{flex:1,overflowY:'auto',padding:'12px 10px'}}>
        <p style={{fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:'.85rem',
          color:F.sombra,textAlign:'center',marginBottom:10}}>
          Encontra os 8 pares! Tentativas: {tent}
        </p>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:7}}>
          {cartas.map(c=>(
            <button key={c.uid} onClick={()=>virar(c.uid)}
              style={{aspectRatio:'1',borderRadius:14,border:'none',cursor:'pointer',
                background:c.encontrado?'#ECFDF5':c.virado?'#fff':`linear-gradient(135deg,${F.cor},${F.sombra})`,
                boxShadow:c.encontrado?'0 3px 0 #A7F3D0':c.virado?'0 4px 0 #E2E8F0':`0 4px 0 ${F.sombra}`,
                fontSize:c.virado||c.encontrado?'1.8rem':'1.4rem',
                transition:'all .3s cubic-bezier(.34,1.56,.64,1)',
                transform:c.virado||c.encontrado?'scale(1.06)':'scale(1)'}}>
              {c.virado||c.encontrado?c.emoji:'❓'}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

              borderRadius:faixa==='young'?24:20,
              padding:faixa==='young'?'15px 14px':'13px 14px',
              cursor:'pointer',textAlign:'left',
              boxShadow:`0 ${faixa==='young'?7:5}px 0 ${m.cor}22`,
              display:'flex',alignItems:'center',gap:12,
              animation:`slideIn .35s ease ${i*65}ms both`,
              transition:'all .2s cubic-bezier(.34,1.56,.64,1)',
            }}
            onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-4px) scale(1.01)';}}
            onMouseLeave={e=>{e.currentTarget.style.transform='';}}>
            <div style={{width:faixa==='young'?60:54,height:faixa==='young'?60:54,
              borderRadius:faixa==='young'?20:16,
              background:`linear-gradient(135deg,${m.cor},${m.sombra})`,
              display:'flex',alignItems:'center',justifyContent:'center',
              fontSize:faixa==='young'?'2.1rem':'1.85rem',flexShrink:0,
              boxShadow:`0 5px 0 ${m.sombra}`}}>
              {m.emoji}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontFamily:"'Baloo 2',cursive",fontWeight:900,
                fontSize:faixa==='young'?'1.05rem':'1rem',
                color:faixa==='young'?'#1C1917':'#fff',marginBottom:3}}>
                {m.nome}
              </div>
              <div style={{fontFamily:'Nunito,sans-serif',fontWeight:700,
                fontSize:'.72rem',
                color:faixa==='young'?'#92807A':'rgba(255,255,255,.5)',marginBottom:5}}>
                {m.desc}
              </div>
              <ProgressBar valor={mundosData[m.id]||0} max={m.max} cor={m.cor} h={faixa==='young'?8:6}/>
            </div>
            <div style={{background:`${m.cor}${faixa==='young'?'33':'33'}`,borderRadius:12,
              padding:'6px 10px',fontFamily:"'Baloo 2',cursive",fontWeight:900,
              fontSize:'.8rem',color:m.cor,flexShrink:0}}>→</div>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   ECRÃ DE CADASTRO — com seleção de idade
═══════════════════════════════════════════════════════════════ */
function Cadastro({onEntrar}){
  const [passo,setPasso]=useState(1); // 1=faixa, 2=avatar+nome
  const [faixa,setFaixa]=useState(null);
  const [nome,setNome]=useState('');
  const [avatar,setAvatar]=useState(0);

  const avataresYoung=['🐣','🐸','🦊','🐨','🐮','🦄','🐰','🐯'];

  const avatares=faixa==='young'?avataresYoung:avataresOlder;
  const F=faixa?FAIXAS[faixa]:null;

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',
      justifyContent:'center',padding:'20px 16px',gap:16,
      background:'linear-gradient(160deg,#1E1B4B 0%,#312E81 50%,#0F172A 100%)',
      position:'relative',overflow:'hidden'}}>

      {[...Array(14)].map((_,i)=>(
        <div key={i} style={{position:'absolute',left:`${rand(2,98)}%`,top:`${rand(2,98)}%`,
          width:rand(2,4),height:rand(2,4),borderRadius:'50%',background:'#fff',
          opacity:Math.random()*.5+.1,pointerEvents:'none',
          animation:`twinkle ${rand(2,5)}s ease-in-out ${rand(0,3)}s infinite alternate`}}/>
      ))}

      {/* Logo */}
      <div style={{textAlign:'center',position:'relative',zIndex:1}}>
        <div style={{fontSize:'3.8rem',animation:'mascotBreathe 3s ease-in-out infinite',
          filter:'drop-shadow(0 8px 16px rgba(0,0,0,.4))'}}>🦉</div>
        <h1 style={{fontFamily:"'Baloo 2',cursive",fontWeight:900,fontSize:'2rem',
          color:'#fff',margin:'6px 0 2px',textShadow:'3px 3px 0 rgba(0,0,0,.3)',letterSpacing:-1}}>
          Aprender<span style={{color:'#FBBF24'}}>+</span>
        </h1>
        <p style={{fontFamily:'Nunito,sans-serif',fontWeight:700,fontSize:'.8rem',
          color:'rgba(255,255,255,.6)',margin:0}}>Aprender é uma aventura! 🚀</p>
      </div>

      {/* PASSO 1 — Escolha da faixa etária */}
      {passo===1&&(
        <div style={{width:'100%',maxWidth:320,position:'relative',zIndex:1}}>
          <div style={{background:'rgba(255,255,255,.08)',borderRadius:24,padding:'20px 16px',
            border:'1px solid rgba(255,255,255,.15)'}}>
            <p style={{fontFamily:"'Baloo 2',cursive",fontWeight:900,fontSize:'1.05rem',
              color:'#fff',textAlign:'center',marginBottom:16}}>
              Quantos anos tens? 🎂
            </p>
            {/* Opção 4-6 */}
            <button onClick={()=>{setFaixa('young');setPasso(2);}}
              style={{width:'100%',padding:'16px 14px',marginBottom:10,borderRadius:20,
                border:'3px solid #10B981',cursor:'pointer',textAlign:'left',
                background:'linear-gradient(135deg,#10B98122,#10B98108)',
                display:'flex',alignItems:'center',gap:14,
                transition:'all .2s',boxShadow:'0 5px 0 #04785733'}}
              onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-4px)';e.currentTarget.style.boxShadow='0 9px 0 #04785744';}}
              onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow='0 5px 0 #04785733';}}>
              <div style={{fontSize:'3rem',flexShrink:0}}>🌱</div>
              <div>
                <div style={{fontFamily:"'Baloo 2',cursive",fontWeight:900,fontSize:'1.2rem',
                  color:'#10B981'}}>4 – 6 anos</div>
                <div style={{fontFamily:'Nunito,sans-serif',fontWeight:700,fontSize:'.75rem',
                  color:'rgba(255,255,255,.65)'}}>Pequeninos · Letras, números e cores</div>
                <div style={{marginTop:4,display:'inline-block',background:'#10B98133',
                  borderRadius:8,padding:'2px 10px',fontFamily:'Nunito,sans-serif',
                  fontWeight:900,fontSize:'.65rem',color:'#10B981'}}>🌟 Nível Fácil</div>
              </div>
            </button>
            {/* Opção 7-8 */}
            <button onClick={()=>{setFaixa('older');setPasso(2);}}
              style={{width:'100%',padding:'16px 14px',borderRadius:20,
                border:'3px solid #6366F1',cursor:'pointer',textAlign:'left',
                background:'linear-gradient(135deg,#6366F122,#6366F108)',
                display:'flex',alignItems:'center',gap:14,
                transition:'all .2s',boxShadow:'0 5px 0 #3730A333'}}
              onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-4px)';e.currentTarget.style.boxShadow='0 9px 0 #3730A344';}}
              onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow='0 5px 0 #3730A333';}}>
              <div style={{fontSize:'3rem',flexShrink:0}}>🚀</div>
              <div>
                <div style={{fontFamily:"'Baloo 2',cursive",fontWeight:900,fontSize:'1.2rem',
                  color:'#818CF8'}}>7 – 8 anos</div>
                <div style={{fontFamily:'Nunito,sans-serif',fontWeight:700,fontSize:'.75rem',
                  color:'rgba(255,255,255,.65)'}}>Exploradores · Palavras, cálculo e calendário</div>
                <div style={{marginTop:4,display:'inline-block',background:'#6366F133',
                  borderRadius:8,padding:'2px 10px',fontFamily:'Nunito,sans-serif',
                  fontWeight:900,fontSize:'.65rem',color:'#818CF8'}}>🔥 Nível Desafio</div>
              </div>
            </button>
          </div>
        </div>
      )}

      {/* PASSO 2 — Avatar + Nome */}
      {passo===2&&F&&(
        <div style={{width:'100%',maxWidth:320,position:'relative',zIndex:1}}>
          <div style={{background:'rgba(255,255,255,.08)',borderRadius:24,padding:'18px 16px',
            border:'1px solid rgba(255,255,255,.15)'}}>
            {/* badge faixa */}
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16,
              background:`${F.cor}22`,borderRadius:14,padding:'8px 12px',
              border:`1.5px solid ${F.cor}44`}}>
              <span style={{fontSize:'1.3rem'}}>{F.emoji}</span>
              <div>
                <div style={{fontFamily:"'Baloo 2',cursive",fontWeight:900,fontSize:'.88rem',color:F.cor}}>
                  {F.label} · {F.nome}
                </div>
                <button onClick={()=>{setPasso(1);setNome('');setAvatar(0);}}
                  style={{background:'none',border:'none',fontFamily:'Nunito,sans-serif',
                    fontWeight:700,fontSize:'.65rem',color:'rgba(255,255,255,.5)',cursor:'pointer',padding:0}}>
                  ← Mudar faixa
                </button>
              </div>
            </div>
            <p style={{fontFamily:"'Baloo 2',cursive",fontWeight:900,fontSize:'.95rem',
              color:'#fff',textAlign:'center',marginBottom:12}}>
              Escolhe o teu mascote! {F.mascote}
            </p>
            {/* avatares */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:14}}>
              {avatares.map((a,i)=>(
                <button key={i} onClick={()=>setAvatar(i)}

                    border:`2.5px solid ${avatar===i?F.cor:'rgba(255,255,255,.15)'}`,
                    background:avatar===i?`${F.cor}33`:'rgba(255,255,255,.06)',
                    fontSize:'1.7rem',cursor:'pointer',
                    transform:avatar===i?'scale(1.12)':'scale(1)',
                    transition:'all .2s',boxShadow:avatar===i?`0 4px 0 ${F.sombra}55`:'none'}}>
                  {a}
                </button>
              ))}
            </div>
            {/* avatar selecionado */}
            <div style={{textAlign:'center',fontSize:'2.8rem',marginBottom:12,
              animation:'mascotBreathe 3s ease-in-out infinite'}}>
              {avatares[avatar]}
            </div>
            {/* nome */}
            <input
              value={nome}
              onChange={e=>setNome(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&nome.trim()&&onEntrar(nome.trim(),avatares[avatar],faixa)}
              placeholder={`O teu nome, ${F.mascote}…`}
              maxLength={18}
              style={{width:'100%',padding:'12px 16px',borderRadius:14,boxSizing:'border-box',
                border:`2px solid ${nome.trim()?F.cor:'rgba(255,255,255,.18)'}`,
                background:'rgba(255,255,255,.1)',color:'#fff',
                fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:'1rem',
                outline:'none',marginBottom:12,transition:'border-color .2s'}}
            />
            <button
              onClick={()=>nome.trim()&&onEntrar(nome.trim(),avatares[avatar],faixa)}
              disabled={!nome.trim()}
              style={{width:'100%',padding:'13px',borderRadius:16,border:'none',
                background:nome.trim()?`linear-gradient(135deg,${F.cor},${F.sombra})`:'rgba(255,255,255,.1)',
                color:nome.trim()?'#fff':'rgba(255,255,255,.3)',
                fontFamily:"'Baloo 2',cursive",fontWeight:900,fontSize:'1.1rem',
                cursor:nome.trim()?'pointer':'not-allowed',
                boxShadow:nome.trim()?`0 6px 0 ${F.sombra}`:'none',transition:'all .25s'}}>
              {faixa==='young'?`Vamos jogar! 🌟`:`Começar! 🚀`}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   APP — RAIZ  (com persistência, sons e mascote)
═══════════════════════════════════════════════════════════════ */
function App(){
  // ── Carregar dados guardados ──────────────────────────────
  const [dadosInicio] = useState(() => Dados.load());

  const [tela,setTela]  = useState(dadosInicio.perfil ? 'hub' : 'cadastro');
  const [perfil,setPerfil]   = useState(dadosInicio.perfil  || '');
  const [avatar,setAvatar]   = useState(dadosInicio.avatar  || '🦉');
  const [faixa,setFaixa]     = useState(dadosInicio.faixa   || 'young');
  const [xp,setXp]           = useState(dadosInicio.xp      || 0);
  const [streak,setStreak]   = useState(dadosInicio.streak  || 0);
  const [mundosData,setMundosData] = useState(dadosInicio.mundos || {});
  const [mundoAtual,setMundoAtual] = useState(null);
  const [jogoAtual,setJogoAtual]   = useState(null);
  const [showXp,setShowXp]   = useState(false);
  const [xpVal,setXpVal]     = useState(0);
  const [combo,setCombo]     = useState(0);
  const [showCombo,setShowCombo] = useState(false);
  const [parts,setParts]     = useState(false);

  // ── Guardar sempre que XP ou mundos mudam ────────────────
  useEffect(()=>{
    if(!perfil) return;
    Dados.save({ xp, streak, lastDay: dadosInicio.lastDay, mundos: mundosData, perfil, avatar, faixa });
  },[xp, mundosData]);

  // ── Mascote ao entrar no hub ──────────────────────────────
  useEffect(()=>{
    if(tela==='hub') setTimeout(()=>Mascote.entrada(), 600);
  },[tela==='hub' && perfil]);

  // ── Verificar nível subido ────────────────────────────────
  const F = FAIXAS[faixa];
  const nivelAnterior = useRef(Math.floor((xp - 0) / (F?.maxXpNivel||60)) + 1);
  useEffect(()=>{
    const nivelAtual = Math.floor(xp / (F?.maxXpNivel||60)) + 1;
    if(nivelAtual > nivelAnterior.current){
      nivelAnterior.current = nivelAtual;
      Mascote.nivel();
    }
  },[xp]);

  const ganharXp=useCallback((val)=>{
    Som.xp();
    setXp(x=>{
      const novo = x + val;
      Dados.save({ xp: novo, streak, lastDay: dadosInicio.lastDay, mundos: mundosData, perfil, avatar, faixa });
      return novo;
    });
    setXpVal(val); setShowXp(true);
    setTimeout(()=>setShowXp(false),1200);
    setCombo(c=>{
      const nc=c+1;
      if(nc>=3){
        Som.combo();
        Mascote.combo(nc);
        setShowCombo(true);
        setTimeout(()=>setShowCombo(false),1500);
      }
      if(nc>=6){setParts(true);setTimeout(()=>setParts(false),1500);}
      return nc;
    });
    if(mundoAtual)
      setMundosData(md=>{
        const novo={...md,[mundoAtual.id]:(md[mundoAtual.id]||0)+1};
        return novo;
      });
  },[mundoAtual, streak, perfil, avatar, faixa]);

  const props={onFim:()=>setTela('mundo'),onXp:ganharXp,faixa};

  const JOGOS_YOUNG={
    abc:()=><JogoABC_Young {...props}/>,
    vogais:()=><JogoVogais_Young {...props}/>,
    numeros:()=><JogoNumeros_Young {...props}/>,
    cores:()=><JogoCores_Young {...props}/>,
    formas:()=><JogoFormas_Young {...props}/>,
    memoria:()=><JogoMemoria_Young {...props}/>,
  };
  const JOGOS_OLDER={
    leitura:()=><JogoLacuna_Older {...props}/>,
    soletrar:()=><JogoSoletrar_Older {...props}/>,
    matematica:()=><JogoMat_Older {...props}/>,
    calendario:()=><JogoCalendario_Older {...props}/>,
    diferente:()=><JogoDiferente_Older {...props}/>,
    memoria2:()=><JogoMemoria_Older {...props}/>,
  };
  const jogoFn=faixa==='young'?(JOGOS_YOUNG[jogoAtual]||null):(JOGOS_OLDER[jogoAtual]||null);
  const jogoRender=jogoFn?jogoFn():null;

  return(
    <div style={{minHeight:'100vh',background:'#030712',display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',padding:'16px'}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;}
        input::placeholder{color:rgba(255,255,255,.38);}
        @keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
        @keyframes popIn{from{transform:scale(.3) rotate(-15deg);opacity:0}70%{transform:scale(1.15) rotate(4deg)}to{transform:scale(1) rotate(0);opacity:1}}
        @keyframes starPop{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.4) rotate(8deg)}100%{transform:scale(1);opacity:1}}
        @keyframes mascotBreathe{0%,100%{transform:scale(1) translateY(0) rotate(-2deg)}50%{transform:scale(1.03) translateY(-6px) rotate(2deg)}}
        @keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
        @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
        @keyframes xpBurst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{transform:translate(-50%,-60%) scale(1.1);opacity:1}100%{transform:translate(-50%,-80%) scale(.8);opacity:0}}
        @keyframes comboPop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg);opacity:1}30%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-70%) scale(.8);opacity:0}}
        @keyframes particleUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-210px) scale(.3) rotate(360deg);opacity:0}}
        @keyframes twinkle{0%{opacity:.12}100%{opacity:.8}}
      `}</style>

      <Particulas ativo={parts}/>
      <XpBurst val={xpVal} show={showXp}/>
      {showCombo&&<ComboBadge count={combo} faixa={faixa}/>}

      {/* Moldura de telemóvel */}
      <div style={{width:375,maxWidth:'100%',background:'#1A1A2E',borderRadius:46,padding:10,
        boxShadow:'0 32px 90px rgba(0,0,0,.95),inset 0 0 0 1px rgba(251,191,36,.1)'}}>
        <div style={{background:'#111',borderRadius:'14px 14px 0 0',height:28,display:'flex',
          alignItems:'center',justifyContent:'center'}}>
          <div style={{width:72,height:6,background:'#1A1A2E',borderRadius:8}}/>
        </div>
        <div style={{background:'#0F172A',borderRadius:'0 0 8px 8px',height:665,
          overflow:'hidden',display:'flex',flexDirection:'column',position:'relative'}}>
          <div key={tela+jogoAtual} style={{flex:1,display:'flex',flexDirection:'column',
            overflow:'hidden',animation:'slideIn .22s ease both'}}>
            {tela==='cadastro'&&(
              <Cadastro onEntrar={(n,av,f)=>{
                const sc = Dados.calcStreak(dadosInicio);
                setStreak(sc.streak);
                const novoDados = { xp, streak: sc.streak, lastDay: sc.lastDay, mundos: mundosData, perfil: n, avatar: av, faixa: f };
                Dados.save(novoDados);
                setPerfil(n); setAvatar(av); setFaixa(f); setTela('hub');
              }}/>
            )}
            {tela==='hub'&&(
              <Hub xp={xp} streak={streak} perfil={perfil} avatar={avatar}
                faixa={faixa} mundosData={mundosData}
                onMundo={(m)=>{setMundoAtual(m);setTela('mundo');}}
                onLogout={()=>{
                  Dados.save({...Dados.load(), perfil:'', avatar:'🦉'});
                  setPerfil(''); setAvatar('🦉'); setTela('cadastro');
                }}/>
            )}
            {tela==='mundo'&&mundoAtual&&(
              <MenuMundo mundo={mundoAtual} faixa={faixa}
                estrelas={mundosData[mundoAtual.id]||0}
                onJogo={(id)=>{setJogoAtual(id);setCombo(0);setTela('jogo');}}
                onVoltar={()=>setTela('hub')}/>
            )}
            {tela==='jogo'&&jogoRender}
          </div>
        </div>
        <div style={{background:'#111',borderRadius:'0 0 36px 36px',height:22,display:'flex',
          alignItems:'center',justifyContent:'center'}}>
          <div style={{width:82,height:4,background:'#1A1A2E',borderRadius:4}}/>
        </div>
      </div>
      <p style={{marginTop:12,color:'rgba(255,255,255,.28)',fontFamily:'Nunito,sans-serif',
        fontWeight:700,fontSize:'.68rem',textAlign:'center'}}>
        Aprender+ · v2 · XP persistente · Sons · Mascote 🦉
      </p>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- PWA: manifest inline (não precisa de ficheiro separado) -->
  <script>
    // Gerar manifest como blob URL
    const manifest = {
      name: "Aprender+",
      short_name: "Aprender+",
      description: "App educativo para crianças 4–8 anos",
      start_url: "./",
      display: "standalone",
      background_color: "#030712",
      theme_color: "#10B981",
      orientation: "portrait",
      icons: [
        { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%2310B981'/%3E%3Ctext x='96' y='130' text-anchor='middle' font-size='110'%3E🦉%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" },
        { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%2310B981'/%3E%3Ctext x='256' y='340' text-anchor='middle' font-size='300'%3E🦉%3C/text%3E%3C/svg%3E", sizes: "512x512", type: "image/svg+xml" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    document.querySelector('link[rel="manifest"]').href = manifestURL;

    // Registar Service Worker básico (cache offline)
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE='aprender-plus-v2';
        const SHELL=['./'];
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL)));
          self.skipWaiting();
        });
        self.addEventListener('activate', e => {
          e.waitUntil(caches.keys().then(keys =>
            Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))
          ));
          self.clients.claim();
        });
        self.addEventListener('fetch', e => {
          e.respondWith(
            caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('./')))
          );
        });
      `;
      const swBlob = new Blob([swCode], {type:'text/javascript'});
      const swURL  = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL).catch(()=>{});
    }
  </script>
