  <script>
    // ── PWA: capturar evento de instalação ──────────────────
    let _deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      _deferredPrompt = e;
      if (!localStorage.getItem('lerbem_pwa_dismissed')) {
        setTimeout(function() {
          var b = document.getElementById('pwa-banner');
          if (b) b.classList.add('show');
        }, 3000);
      }
    });

    window.addEventListener('appinstalled', function() {
      var b = document.getElementById('pwa-banner');
      if (b) b.classList.remove('show');
      _deferredPrompt = null;
    });

    document.getElementById('pwa-install-btn').addEventListener('click', async function() {
      var b = document.getElementById('pwa-banner');
      if (b) b.classList.remove('show');
      if (_deferredPrompt) {
        _deferredPrompt.prompt();
        await _deferredPrompt.userChoice;
        _deferredPrompt = null;
      }
    });

    document.getElementById('pwa-close-btn').addEventListener('click', function() {
      var b = document.getElementById('pwa-banner');
      if (b) b.classList.remove('show');
      localStorage.setItem('lerbem_pwa_dismissed', '1');
    });

    // ── Mostrar erro se app não carregar em 10s ─────────────
    setTimeout(function() {
      var root = document.getElementById('root');
      if (root && !root.hasChildNodes()) {
        var ls = document.getElementById('loading-screen');
        var es = document.getElementById('error-screen');
        if (ls) ls.style.display = 'none';
        if (es) es.classList.add('show');
      }
    }, 10000);

    // ── Registar Service Worker ─────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('[SW] Registado:', reg.scope))
        .catch(err => console.warn('[SW] Erro no registo:', err));
    }

    // ── Gestão de estado Offline/Online ─────────────────────
    const offlineBanner = document.getElementById('offline-banner');
    function updateOnlineStatus() {
      if (!navigator.onLine) {
        offlineBanner.classList.add('show');
        console.warn('[LerBem] Modo offline activo');
      } else {
        offlineBanner.classList.remove('show');
      }
    }
    window.addEventListener('online',  updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus(); // verificar estado actual no arranque
  </script>
